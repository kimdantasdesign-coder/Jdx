name: Build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: AdmKit
          path: target/AdmKit.jar
      - name: Publicar o jar em Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest target/AdmKit.jar --title "AdmKit.jar" --notes "Jar compilado automaticamente." --target "${{ github.sha }}"
